name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. حذف الملف الصوتي والخط نهائياً لو وجدوا
          find . -type f -name "*.m4a" -delete
          find . -type f -name "*.ttf" -delete
          
          # 2. تصفير الـ Git القديم وإنشاء تاريخ جديد متوافق مع الفرع الرئيسي
          rm -rf .git
          git init
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          # 3. البناء مباشرة على فرع main
          git checkout -b main
          git add .
          git commit -m "Deploy to main branch on HF"
          
          # 4. الرفع الإجباري لفرع main الرئيسي في Hugging Face
          git remote add hf https://m7mddemo0o:$HF_TOKEN@huggingface.co/spaces/m7mddemo0o/sovereign-bot
          git push --force hf main:main
