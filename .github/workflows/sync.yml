name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Clean Binary Files for HF
        run: |
          find . -type f -name "*.m4a" -delete
          find . -type f -name "*.ttf" -delete
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Clean binary files for Hugging Face deployment"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://m7mddemo0o:$HF_TOKEN@huggingface.co/spaces/m7mddemo0o/sovereign-bot
          git push --force hf dev:main
